<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观象 · 三层纹样试验台</title><style>
:root{color-scheme:dark;--bg:#10100d;--panel:#171610;--ink:#eee5d3;--muted:#aca18e;--gold:#c6a873;--line:#c6a87330}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--gold);text-underline-offset:5px}header{padding:23px 4%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:22px;letter-spacing:4px}.brand small{font-size:10px;letter-spacing:2px;color:var(--muted);margin-left:18px}header nav{display:flex;gap:22px;font-size:12px}.intro{padding:28px 4% 20px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold)}h1{font-weight:400;letter-spacing:5px;font-size:30px;margin:10px 0 8px}.intro p{font-size:12px;color:var(--muted);line-height:1.8;margin:0}.intro-actions{display:flex;gap:9px;flex-wrap:wrap}button,.button{border:1px solid var(--line);background:#1a1812;color:var(--ink);padding:10px 14px;font-size:12px;text-decoration:none}button:hover{border-color:var(--gold)}button.primary{background:#c6a873;color:#14110b;border-color:#c6a873}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;padding:0 4% 42px;align-items:start}.workspace{position:sticky;top:16px;min-width:0}.stage{position:relative;aspect-ratio:1.12;min-height:360px;max-height:730px;border:1px solid var(--line);background:radial-gradient(ellipse at center,#25201444,transparent 68%);overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.stage-top,.stage-bottom{position:absolute;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;font-size:10px;color:var(--muted);letter-spacing:1px}.stage-top{top:18px}.stage-bottom{bottom:18px}.stage-bottom button{pointer-events:auto;font-size:10px;padding:7px 10px;background:#15130fe6}.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#c8b488;margin-right:6px}.canvas-toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:13px 0;color:var(--muted);font-size:11px}.canvas-toolbar label{display:flex;gap:7px;align-items:center}.canvas-toolbar input{accent-color:var(--gold)}.atom-panel{padding:18px 20px;border:1px solid var(--line);background:#15140f}.atom-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.atom-heading h2{font-size:15px;font-weight:400;margin:0}.atom-heading span{font-size:10px;color:var(--muted)}#atom{width:100%;height:116px;display:block;margin:10px 0}.atom-note{font-size:11px;color:var(--muted);line-height:1.8;margin:0}.inspector{border:1px solid var(--line);background:var(--panel)}.panel-heading{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;letter-spacing:2px}.panel-heading span{font-size:10px;color:var(--muted);letter-spacing:0}.layer-list{padding:8px}.layer-row{display:flex;align-items:center;border:1px solid transparent;margin:5px 0;background:#12120e}.layer-row.active{border-color:var(--gold);background:#252016}.layer-button{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:transparent;padding:10px}.layer-number{font-size:10px;color:var(--muted)}.mini{width:35px;height:35px;flex-shrink:0;display:block}.mini svg{width:100%;height:100%}.layer-name{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layer-caption{display:block;font:10px/1.8 Georgia;color:var(--muted)}.layer-enable{margin-right:12px;accent-color:var(--gold)}.editor{padding:15px 20px 22px;border-top:1px solid var(--line)}.editor-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;font-size:12px}.mode{font-size:10px;color:var(--gold)}.field{margin:17px 0}.field>label,.field-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#c8bfae;margin-bottom:9px}.field-head span{font-size:10px;color:var(--muted)}select{display:block;width:100%;padding:10px;background:#10100c;color:var(--ink);border:1px solid #c6a87350;font-size:12px}.slider-pair{display:grid;grid-template-columns:minmax(0,1fr) 69px;gap:13px;align-items:center}input[type=range]{width:100%;accent-color:var(--gold);height:20px;cursor:pointer}input[type=number],input[type=text]{width:100%;padding:6px 8px;text-align:right;background:#11110d;border:1px solid var(--line);color:var(--ink);font:12px Georgia}.color-row{display:grid;grid-template-columns:43px 1fr;gap:10px}.color-row input[type=color]{width:43px;height:31px;padding:2px;background:#11110d;border:1px solid var(--line);cursor:pointer}.color-row input[type=text]{text-align:left;font-family:ui-monospace,monospace}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two .field{margin:8px 0}.geometry-readout{font:11px/1.9 Georgia;color:var(--muted);padding:12px;background:#10110c;border-left:2px solid var(--gold)}details{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}summary{font-size:11px;color:var(--muted);cursor:pointer}.editor button.full{width:100%;margin-top:18px}.footnote{font-size:10px;line-height:1.8;color:var(--muted);margin:12px 0 0}.status{min-height:20px;color:var(--gold);font-size:11px;padding:0 4% 22px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #e4c78b;outline-offset:3px}footer{padding:20px 4%;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:15px}@media(min-width:1550px){.layout,.intro,header,footer,.status{padding-left:max(4%,calc((100vw - 1450px)/2));padding-right:max(4%,calc((100vw - 1450px)/2))}}@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 320px;gap:16px}.stage{min-height:320px;aspect-ratio:.88}.editor{padding:12px 15px 18px}.atom-panel{padding:15px}.intro p{max-width:470px}}@media(max-width:760px){header{padding:18px 5%}.brand small{display:none}header nav{gap:14px;font-size:11px}.intro{padding:24px 5% 18px;display:block}h1{font-size:27px}.intro-actions{margin-top:18px}.layout{display:flex;flex-direction:column;padding:0 5% 30px;gap:20px}.workspace{display:contents}.stage{position:sticky;top:0;z-index:4;width:100%;height:min(38svh,380px);aspect-ratio:auto;min-height:0;max-height:none;background:radial-gradient(ellipse at center,#25201466,transparent 68%),#10100d}.atom-panel{width:100%}.stage-top,.stage-bottom{left:12px;right:12px;font-size:9px}.stage-top{top:12px}.stage-bottom{bottom:12px}.inspector{width:100%}.atom-panel{padding:14px}.atom-heading h2{font-size:13px}#atom{height:95px}.canvas-toolbar{font-size:10px;gap:8px}.status{padding:0 5% 15px}.editor{padding:16px 20px 22px}.field{margin:20px 0}}
</style></head><body>
<header><span class="brand">观象 <small>ORNAMENT WORKSHOP</small></span><nav><a href="ornament-library.html">纹样图谱 ↗</a><a href="overlay-review.html">原图叠加 ↗</a></nav></header>
<section class="intro"><div><span class="eyebrow">THREE LAYERS · INFINITE REPEAT</span><h1>纹样试验台</h1><p>选择原子，调整节距，让三层纹样自由生长。<span id="catalog-count"></span></p></div><div class="intro-actions"><button id="pause" aria-pressed="false">暂停运动</button><button id="avatar-preset">博客头像</button><button id="reset">恢复初始组合</button><button id="export" class="primary">导出当前 SVG ↓</button></div></section>
<main class="layout"><section class="workspace"><div class="stage"><canvas id="composition" role="img" aria-label="三层可配置的中式纹样实时组合"></canvas><div class="stage-top"><span><i class="live-dot"></i><span id="motion-status">缓慢自转</span></span><span id="copy-count"></span></div><div class="stage-bottom"><span id="view-info"></span><button id="fit">适配画布</button></div></div><div class="canvas-toolbar"><label><input id="guides" type="checkbox" checked>显示当前层内外边界</label><label><input id="seams" type="checkbox" checked>标出原子接口</label><span id="selection-caption"></span></div><section class="atom-panel"><div class="atom-heading"><h2>当前原子 · 展开三份</h2><span id="atom-type"></span></div><canvas id="atom" role="img" aria-label="当前原子单元连续复制三份的展开图"></canvas><p class="atom-note" id="atom-note"></p></section></section>
<aside class="inspector"><div class="panel-heading">图层 <span>同一纹样可重复选用</span></div><div class="layer-list" id="layers"></div><div class="editor"><div class="editor-heading"><span id="editor-title">编辑第 1 层</span><span class="mode" id="mode"></span></div><div class="field"><label for="pattern">选择纹样</label><select id="pattern" aria-label="当前层纹样"></select></div>
<div class="two"><div class="field"><label for="color-text">颜色</label><div class="color-row"><input id="color-picker" type="color" aria-label="当前层颜色选择器"><input id="color-text" type="text" maxlength="7" aria-label="当前层颜色十六进制" spellcheck="false"></div></div><div class="field"><label for="stroke-number">线宽</label><div class="slider-pair" style="grid-template-columns:1fr 53px;gap:7px"><input id="stroke-range" type="range" min="0.25" max="5" step="0.05" aria-label="拖动调整线宽"><input id="stroke-number" type="number" min="0.1" max="12" step="0.1" aria-label="线宽数值"></div></div></div>
<div class="field"><div class="field-head"><label for="repeat-range">重复次数 / 稠密度</label><span id="repeat-unit">原子组</span></div><div class="slider-pair"><input id="repeat-range" type="range" min="1" max="120" step="1" aria-label="拖动调整重复次数"><input id="repeat-number" type="number" min="1" max="240" step="1" aria-label="重复次数数值"></div></div>
<div class="field"><div class="field-head"><label for="radius-range">中心半径</label><span>原子排列的圆周</span></div><div class="slider-pair"><input id="radius-range" type="range" min="0" max="420" step="0.001" aria-label="拖动调整半径"><input id="radius-number" type="number" min="0" max="1200" step="0.001" aria-label="半径数值"></div></div>
<div class="field"><div class="field-head"><label for="thickness-range" id="thickness-label">环带厚度</label><span id="thickness-help">外半径 − 内半径</span></div><div class="slider-pair"><input id="thickness-range" type="range" min="1" max="180" step="0.001" aria-label="拖动调整厚度"><input id="thickness-number" type="number" min="1" max="600" step="0.001" aria-label="厚度数值"></div></div>
<div class="geometry-readout" id="geometry-readout" aria-live="polite"></div>
<details open><summary>方向与运动</summary><div class="field"><div class="field-head"><label for="rotation-range">起始角度</label><output id="rotation-value"></output></div><input id="rotation-range" type="range" min="0" max="360" step="1" aria-label="当前层起始角度"></div><div class="field"><div class="field-head"><label for="speed-range">旋转速度</label><output id="speed-value"></output></div><input id="speed-range" type="range" min="-3" max="3" step="0.1" aria-label="当前层旋转速度"></div><div class="field"><div class="field-head"><label for="opacity-range">不透明度</label><output id="opacity-value"></output></div><input id="opacity-range" type="range" min="0.1" max="1" step="0.05" aria-label="当前层不透明度"></div></details>
<button class="full" id="all-same">把此纹样用于三层</button><p class="footnote" id="pattern-note"></p></div></aside></main>
<div class="status" id="status" aria-live="polite"></div><footer><span>共享原子库 · 图谱与测试台使用同一套几何</span><span>参数自动保存在当前浏览器</span><a href="/posts/svg-traditional-ornaments/">回到文章 ↗</a></footer>
<script src="ornament-manifest.js"></script><script src="ornament-geometry.js"></script><script src="vine-petal.js"></script><script src="ornament-engine.js"></script><script src="studio.js"></script></body></html>
